name: Build Safari Beacon

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler le mod
        run: ./gradlew build

      - name: Publier le .jar
        uses: actions/upload-artifact@v4
        with:
          name: safari-beacon-jar
          path: build/libs/safari-beacon-*.jar
